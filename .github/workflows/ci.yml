# Every check lives in tools/ci, so a developer runs the same code at
# the same commit (10 10.2). This file only names the arm64 runners
# (x64.yml runs the x64 ones on a schedule, best effort), pins the
# actions by commit, sets the mise environment, and calls tools/ci;
# "go run ./tools/ci workflows" holds it to that grammar.
name: ci

on:
  pull_request:
    # edited: a change to the title or the body runs the checks again.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# One run in progress per pull request: a new run of a pull request, an
# edit of its title or body among them, cancels the one in progress, so
# an edit does not queue a second full run. A push has a group of its
# own commit and cancels nothing, so every commit of main is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.head_commit.id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The environment of every mise run, mise-action's and the one of the
# mise shim that starts go: mise reads mise.toml as its one
# configuration file, and mise.lock, and every go command of the job
# reads no "go env -w" file and starts no other go. It is
# miseEnv in tools/ci/misefiles.go, which says why, and the workflows
# check holds this table to that list.
env:
  MISE_OVERRIDE_CONFIG_FILENAMES: mise.toml
  MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES: none
  MISE_ENV: ""
  MISE_AUTO_ENV: "false"
  MISE_GLOBAL_CONFIG_FILE: /dev/null/mise-global.toml
  MISE_SYSTEM_CONFIG_FILE: /dev/null/mise-system.toml
  MISE_AUTO_INSTALL: "false"
  MISE_NOT_FOUND_AUTO_INSTALL: "false"
  GOENV: "off"
  GOTOOLCHAIN: local

jobs:
  all:
    name: all on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Each runner reports on its own, so one red platform does not
      # hide the state of the others.
      fail-fast: false
      matrix:
        # mise_sha256 is the sha256 of the mise binary of that platform,
        # mise 2026.10.3, as its signed SHASUMS256.txt lists it.
        include:
          - os: ubuntu-26.04-arm
            mise_sha256: 357260e28904569a6e7124d33b65cef6d043846c07bb8f4906ddf22cc353d61d
          - os: macos-26
            mise_sha256: 0999bd4943523ccdbd149b5ad4080281536801b3f6406ac4495699bd0310969c
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install mise and the tools of mise.lock
        # jdx/mise-action v5.1.1
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.3
          sha256: ${{ matrix.mise_sha256 }}
          # No actions cache: an install restored from a cache is not
          # checked again against the checksums of mise.lock.
          cache: false
          # No export of the mise environment: the steps reach go
          # through the mise shims, and tools/ci builds the environment
          # of each check itself.
          env: false
          # The token the action reads stays in the action: no later
          # step holds it (10 10.2).
          persist_github_token: false
      - name: Restore the downloads of the container e2e
        # actions/cache v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          # CacheDir of e2e/internal/container: the herdr and the mise
          # it downloads, each checked against kits/pins.yaml when it is
          # installed for the cases, so a restored file is not trusted
          # for being cached. The image of the workload is not cached:
          # every run pulls it by its digest. The key names the runner's
          # OS and architecture, so each architecture keeps its own
          # entry and a macOS runner, which runs no container e2e,
          # finds none to restore and saves none, and then one hash of
          # the fixture mise.lock and the herdr and mise pins, so a pin
          # that changes is a new entry (CacheKey of
          # tools/ci/internal/container, which the workflows test holds
          # it to).
          path: /tmp/romeu-e-julieta-container-e2e
          key: container-e2e-${{ runner.os }}-${{ runner.arch }}-87f76e55cffe50ac5b1dab8f74384c9fa41bd7e6ae61d22f3f6c9bab262b6344
      - name: Trust mise.toml and fill the module cache
        run: go run ./tools/ci setup
      # tools/ci is built and then run, not started by "go run", which
      # reaches the job with every exit status other than 0 as 1: so the
      # job ends with the status tools/ci returns, 3 for an
      # infrastructure error among them.
      - name: Build tools/ci
        run: go build -o "$RUNNER_TEMP/ci" ./tools/ci
      - name: All checks
        run: '"$RUNNER_TEMP/ci" all'
