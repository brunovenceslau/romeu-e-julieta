# The x64 runners, best effort (10 10.2, Runners): the same jobs as
# ci.yml, on a schedule and by hand, so no pull request waits for them.
# A red run is fixed when it is seen and blocks no merge; GitHub sends
# no notice of one, and turns the schedule off after 60 days without
# activity in the repository. Keep the jobs
# equal to the ones of ci.yml; "go run ./tools/ci workflows" holds this
# file to the same grammar, and tools/ci setup reads the mise_sha256 of
# an x64 runner from this matrix.
name: x64

on:
  schedule:
    # Every day at 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:

# A run cancels none in progress, and the schedule and a dispatch by
# hand are groups of their own, so neither replaces the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# The environment of every mise run, mise-action's and the one of the
# mise shim that starts go: mise reads mise.toml as its one
# configuration file, and mise.lock, and every go command of the job
# reads no "go env -w" file and starts no other go. It is
# miseEnv in tools/ci/misefiles.go, which says why, and the workflows
# check holds this table to that list.
env:
  MISE_OVERRIDE_CONFIG_FILENAMES: mise.toml
  MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES: none
  MISE_ENV: ""
  MISE_AUTO_ENV: "false"
  MISE_GLOBAL_CONFIG_FILE: /dev/null/mise-global.toml
  MISE_SYSTEM_CONFIG_FILE: /dev/null/mise-system.toml
  MISE_AUTO_INSTALL: "false"
  MISE_NOT_FOUND_AUTO_INSTALL: "false"
  GOENV: "off"
  GOTOOLCHAIN: local

jobs:
  # The checks that judge the commit and the tree and run none of its tests
  # (tools/ci static); on Linux alone, since lint, fix, vet and
  # vulnerabilities run once per target of the lint list, the darwin ones
  # included, and license runs on Linux only.
  static:
    name: static on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Each runner reports on its own, so one red platform does not
      # hide the state of the others.
      fail-fast: false
      matrix:
        # mise_sha256 is the sha256 of the mise binary of that platform,
        # mise 2026.10.3, as its signed SHASUMS256.txt lists it.
        include:
          - os: ubuntu-26.04
            mise_sha256: 8d48bc510b7d844fad0bc7156c0855c2a1e7230c51e498a7f6b63b021f8b57c5
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install mise and the tools of mise.lock
        # jdx/mise-action v5.1.1
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.3
          sha256: ${{ matrix.mise_sha256 }}
          # No actions cache: an install restored from a cache is not
          # checked again against the checksums of mise.lock.
          cache: false
          # No export of the mise environment: the steps reach go
          # through the mise shims, and tools/ci builds the environment
          # of each check itself.
          env: false
          # The token the action reads stays in the action: no later
          # step holds it (10 10.2).
          persist_github_token: false
      - name: Trust mise.toml and fill the module cache
        run: go run ./tools/ci setup
      # tools/ci is built and then run, not started by "go run", which
      # reaches the job with every exit status other than 0 as 1: so the
      # job ends with the status tools/ci returns, 3 for an
      # infrastructure error among them.
      - name: Build tools/ci
        run: go build -o "$RUNNER_TEMP/ci" ./tools/ci
      - name: Static checks
        run: '"$RUNNER_TEMP/ci" static'

  # The one test run, with the race detector, and the coverage check after
  # it (tools/ci race), on every runner.
  race:
    name: race on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Each runner reports on its own, so one red platform does not
      # hide the state of the others.
      fail-fast: false
      matrix:
        # mise_sha256 is the sha256 of the mise binary of that platform,
        # mise 2026.10.3, as its signed SHASUMS256.txt lists it.
        include:
          - os: ubuntu-26.04
            mise_sha256: 8d48bc510b7d844fad0bc7156c0855c2a1e7230c51e498a7f6b63b021f8b57c5
          - os: macos-26-intel
            mise_sha256: 38cdd1d904b25e66ec2fff3b5c88930853ab929b63e72c70e77198f82d6ac144
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install mise and the tools of mise.lock
        # jdx/mise-action v5.1.1
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.3
          sha256: ${{ matrix.mise_sha256 }}
          # No actions cache: an install restored from a cache is not
          # checked again against the checksums of mise.lock.
          cache: false
          # No export of the mise environment: the steps reach go
          # through the mise shims, and tools/ci builds the environment
          # of each check itself.
          env: false
          # The token the action reads stays in the action: no later
          # step holds it (10 10.2).
          persist_github_token: false
      - name: Trust mise.toml and fill the module cache
        run: go run ./tools/ci setup
      # tools/ci is built and then run, not started by "go run", which
      # reaches the job with every exit status other than 0 as 1: so the
      # job ends with the status tools/ci returns, 3 for an
      # infrastructure error among them.
      - name: Build tools/ci
        run: go build -o "$RUNNER_TEMP/ci" ./tools/ci
      - name: Race run and coverage
        run: '"$RUNNER_TEMP/ci" race'

  # The container e2e (tools/ci e2e); it runs on Linux alone.
  e2e:
    name: e2e on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Each runner reports on its own, so one red platform does not
      # hide the state of the others.
      fail-fast: false
      matrix:
        # mise_sha256 is the sha256 of the mise binary of that platform,
        # mise 2026.10.3, as its signed SHASUMS256.txt lists it.
        include:
          - os: ubuntu-26.04
            mise_sha256: 8d48bc510b7d844fad0bc7156c0855c2a1e7230c51e498a7f6b63b021f8b57c5
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install mise and the tools of mise.lock
        # jdx/mise-action v5.1.1
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.3
          sha256: ${{ matrix.mise_sha256 }}
          # No actions cache: an install restored from a cache is not
          # checked again against the checksums of mise.lock.
          cache: false
          # No export of the mise environment: the steps reach go
          # through the mise shims, and tools/ci builds the environment
          # of each check itself.
          env: false
          # The token the action reads stays in the action: no later
          # step holds it (10 10.2).
          persist_github_token: false
      - name: Restore the downloads of the container e2e
        # actions/cache v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          # CacheDir of e2e/internal/container: the herdr and the mise
          # it downloads, each checked against kits/pins.yaml when it is
          # installed for the cases, so a restored file is not trusted
          # for being cached. The image of the workload is not cached:
          # every run pulls it by its digest. The key names the runner's
          # OS and architecture, so each architecture keeps its own
          # entry, and then one hash of
          # the fixture mise.lock and the herdr and mise pins, so a pin
          # that changes is a new entry (CacheKey of
          # tools/ci/internal/container, which the workflows test holds
          # it to).
          path: /tmp/romeu-e-julieta-container-e2e
          key: container-e2e-${{ runner.os }}-${{ runner.arch }}-87f76e55cffe50ac5b1dab8f74384c9fa41bd7e6ae61d22f3f6c9bab262b6344
      - name: Trust mise.toml and fill the module cache
        run: go run ./tools/ci setup
      # tools/ci is built and then run, not started by "go run", which
      # reaches the job with every exit status other than 0 as 1: so the
      # job ends with the status tools/ci returns, 3 for an
      # infrastructure error among them.
      - name: Build tools/ci
        run: go build -o "$RUNNER_TEMP/ci" ./tools/ci
      - name: Container e2e
        run: '"$RUNNER_TEMP/ci" e2e'

  # The aggregators, one per host (those of ci.yml are the required checks
  # of main, and these block no merge): all on ubuntu-26.04 and
  # all on macos-26-intel. GitHub reports a skipped job as a success, also
  # for a required check, and a job is skipped when a job it needs fails, so an
  # aggregator with needs alone would let a red job merge. Each one needs
  # every other job and runs only when one of them did not succeed (the
  # if, which the workflows check compares byte for byte), and then fails;
  # when every job succeeded it is skipped, which GitHub reports as a
  # success. Both need every job, so a red job turns both red: the name
  # is the one the ruleset requires, not a promise about which host failed.
  # Each is a job of its own, not a matrix, since GitHub names a skipped
  # matrix job with its expression unexpanded and a required check would
  # never match.
  all_linux:
    name: all on ubuntu-26.04
    runs-on: ubuntu-26.04
    needs: [static, race, e2e]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')) }}
    timeout-minutes: 5
    steps:
      - run: exit 1

  all_macos:
    name: all on macos-26-intel
    runs-on: ubuntu-26.04
    needs: [static, race, e2e]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')) }}
    timeout-minutes: 5
    steps:
      - run: exit 1
