# The x64 runners, best effort (10 10.2, Runners): the same job as
# ci.yml, on a schedule and by hand, so no pull request waits for them.
# A red run is fixed when it is seen and blocks no merge; GitHub sends
# no notice of one, and turns the schedule off after 60 days without
# activity in the repository. Keep the job
# equal to the one of ci.yml; "go run ./tools/ci workflows" holds this
# file to the same grammar, and tools/ci setup reads the mise_sha256 of
# an x64 runner from this matrix.
name: x64

on:
  schedule:
    # Every day at 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run per workflow and ref: a new run of a pull request, an edit of
# its title or body among them, cancels the one in progress, so an edit
# does not queue a second full run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The environment of every mise run, mise-action's and the one of the
# mise shim that starts go: mise reads mise.toml as its one
# configuration file, and mise.lock, and every go command of the job
# reads no "go env -w" file and starts no other go. It is
# miseEnv in tools/ci/misefiles.go, which says why, and the workflows
# check holds this table to that list.
env:
  MISE_OVERRIDE_CONFIG_FILENAMES: mise.toml
  MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES: none
  MISE_ENV: ""
  MISE_AUTO_ENV: "false"
  MISE_GLOBAL_CONFIG_FILE: /dev/null/mise-global.toml
  MISE_SYSTEM_CONFIG_FILE: /dev/null/mise-system.toml
  MISE_AUTO_INSTALL: "false"
  MISE_NOT_FOUND_AUTO_INSTALL: "false"
  GOENV: "off"
  GOTOOLCHAIN: local

jobs:
  all:
    name: all on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Each runner reports on its own, so one red platform does not
      # hide the state of the others.
      fail-fast: false
      matrix:
        # mise_sha256 is the sha256 of the mise binary of that platform,
        # mise 2026.10.3, as its signed SHASUMS256.txt lists it.
        include:
          - os: ubuntu-26.04
            mise_sha256: 8d48bc510b7d844fad0bc7156c0855c2a1e7230c51e498a7f6b63b021f8b57c5
          - os: macos-26-intel
            mise_sha256: 38cdd1d904b25e66ec2fff3b5c88930853ab929b63e72c70e77198f82d6ac144
    steps:
      - name: Check out
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install mise and the tools of mise.lock
        # jdx/mise-action v5.1.1
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.10.3
          sha256: ${{ matrix.mise_sha256 }}
          # No actions cache: an install restored from a cache is not
          # checked again against the checksums of mise.lock.
          cache: false
          # No export of the mise environment: the steps reach go
          # through the mise shims, and tools/ci builds the environment
          # of each check itself.
          env: false
          # The token the action reads stays in the action: no later
          # step holds it (10 10.2).
          persist_github_token: false
      - name: Restore the downloads of the container e2e
        # actions/cache v6.1.0
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          # CacheDir of e2e/internal/container: the herdr and the mise
          # it downloads, each checked against kits/pins.yaml whenever
          # it is read, so a restored file is not trusted for being
          # cached. The key is the sha256 of the fixture mise.lock
          # (e2e/internal/container/testdata/fixture.mise.lock), which
          # the workflows test holds it to.
          path: /tmp/romeu-e-julieta-container-e2e
          key: container-e2e-3f91d2235d0f01564e532831813a9010e4a800e2507e6637fc44b16ac0c66d7c
      - name: Trust mise.toml and fill the module cache
        run: go run ./tools/ci setup
      - name: All checks
        run: go run ./tools/ci all
