# The single list of paths whose changes need the maintainer's explicit
# approval (05 5.3). "go generate ./..." derives .github/CODEOWNERS from
# it; the approval line a pull request
# carries is defined in 12 12.4. The file lists itself.
version: 1
owner: "@brunovenceslau"
surfaces:
  - id: gates
    globs: [internal/gate/**, internal/state/**, internal/spec/project.go, internal/spec/run.go, internal/spec/rules.go]
    reason: the gates, the state machines, the gate/apply struct tags that define the widening set with the committed list of ungated members, and the types and validation rules of the project spec they classify
  - id: gitsafe
    globs: [internal/gitsafe/**]
    reason: every git invocation on the host, ref namespaces including salvage
  - id: procgroup
    globs: [internal/procgroup/**]
    reason: the one package that starts subprocesses, kills their process groups and keeps a child from inheriting the host environment (bar the list of REQ-0470), with the call-site scan and its admitted list
  - id: termsafe
    globs: [internal/termsafe/**, internal/cli/writer*.go]
    reason: host output escaping
  - id: digests
    globs: [internal/canon/**]
    reason: every digest the gates compare
  - id: signing
    globs: [internal/signing/**, kits/git-ssh-sign/**]
    reason: commit signing key isolation
  - id: catalog
    globs: [internal/catalog/**, internal/egress/**]
    reason: upload flags, the base and meta sets, and the egress derivation that reads them
  - id: sbxdrv
    globs: [internal/sbxdrv/**, e2e/fakesbx/**]
    reason: the one package that drives sbx, and its fake, which hold the I4 and I25 guards
  - id: kits
    globs: [kits/**, tools/kitpin/**, skills/**]
    reason: what enters every sandbox, its pins, and the skills agents follow
  - id: release
    globs: [.github/workflows/release.yml, tools/release/**]
    reason: release and publishing paths
  - id: dependencies
    globs: [go.mod, go.sum, mise.toml, mise.lock, .mise.toml, mise.*.toml, .mise.*.toml, mise/**, .mise/**, .config/mise.toml, .config/mise.*.toml, .config/mise/**, .tool-versions, .miserc.toml, .miserc.local.toml, .config/miserc.toml, .github/workflows/**]
    reason: Go dependencies, the pinned tools the gates run with every file mise reads as its configuration, and CI actions
  - id: contracts
    globs: [internal/*/errors.go, internal/cmd/*/*/errors.go, internal/spec/versions.go, internal/manifest/versions.go]
    reason: exit codes and error ids, declared per package, the file format versions and the manifest's protocol window
  - id: formats
    globs: [schemas/**]
    reason: the generated schemas of the formats; a member and its meaning are fixed once merged (03, REQ-0163), so each change needs the maintainer's approval
  - id: ledger
    globs: [internal/ledger/**]
    reason: the runtime ledger's code, its event schema, and the tags that decide which fields cross projects
  - id: decisions
    globs: [docs/adr/**, .adr-dir]
    reason: decision records; one leaves Proposed, or changes after that, with the maintainer's approval
  - id: spec
    globs: [docs/spec.md, docs/spec/01-system-model.md, docs/spec/05-security.md]
    reason: the gates read tables in these pages (the vocabulary in 01 1.7 and the index), and 05 holds the security model
  - id: approvals
    globs: [tools/ci/internal/askfirst/**, tools/ci/denylist.yaml, .github/workflows/**]
    reason: the approval-line and grant check, the forbidden-name denylist, and the workflows that choose what runs
  - id: checks
    globs: [tools/ci/*.go, tools/ci/denylist.yaml, tools/ci/internal/check/**, tools/ci/internal/coverage/**, tools/ci/internal/license/**, tools/ci/internal/vulnerabilities/**, tools/ci/internal/race/**, tools/ci/internal/unit/**, tools/ci/internal/vet/**, tools/ci/internal/lint/**, tools/ci/internal/citest/**, tools/ci/internal/mise/**, tools/ci/internal/setup/**, tools/ci/internal/hygiene/**, tools/ci/internal/pushedrange/**, tools/ci/internal/drift/**, tools/ci/internal/fix/**, tools/ci/adrdir/**, tools/ci/internal/workflows/**, tools/ci/internal/plan/**, tools/ci/internal/askfirst/**, tools/ci/internal/pr/**, tools/ci/internal/kits/**, tools/ci/internal/schema/**, tools/ci/internal/catalog/**, tools/ci/internal/callsites/**, tools/ci/internal/crossbuild/**, tools/ci/internal/format/**, tools/ci/internal/identifiers/**, tools/ci/internal/imports/**, tools/ci/internal/moduletree/**, tools/ci/internal/reqs/**, tools/ci/git/**, tools/ci/goenv/**, tools/ci/names/**, tools/ci/prose/**, tools/ci/prose.yaml, tools/ci/pushed/**, tools/mutants/**, .githooks/**, .golangci.yml, docs/acceptance.json]
    reason: the runner of the gates, the steps whose result decides whether all passes (coverage, license, vulnerabilities, race, unit, vet, lint) with the fixtures their tests share, the checks a security rule rests on (the pinned tools and the hook's environment, hygiene and the forbidden names, the generated files, the workflow grammar, the plan, the approval lines, the kits, the vendored kit schema and its pinned digests, the catalog, the call sites, the module boundaries and the invariant guards of tools/ci imports, the cross build, the formatter, the word lists of the documentation standard, and the agreement of the specification and the code), the mutation runner, the forbidden-name denylist, the linter configuration and the acceptance file, whose command items tools/ci acceptance runs
  - id: ask-first
    globs: [.github/ask-first.yaml, .github/CODEOWNERS, docs/grants.yaml]
    reason: this list, the CODEOWNERS file generated from it, and the checkpoint grants that stand in for approval lines
