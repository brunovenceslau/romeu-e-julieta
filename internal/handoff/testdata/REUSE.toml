# The license of each fixture of handoff, none of which can carry an SPDX
# header of its own (REUSE 3.3). Each is a handoff file (03 3.10) or a
# golden print written for these tests:
# - valid-clear.md, valid-final.md and valid-facts.md: the example of 03
#   3.10 with one repo, for each kind;
# - invalid-anchor.md, invalid-alias.md, invalid-merge-key.md,
#   invalid-include.md and invalid-duplicate-key.md: valid-clear.md with
#   one construct the strict decoder refuses;
# - unknown-key.md and unknown-repo-key.md: valid-clear.md with one key
#   a newer writer adds, in the front matter and in a repo, read as the
#   file without it (REQ-0163);
# - invalid-missing-headings.md, invalid-final-five-headings.md and
#   invalid-facts-body.md: a body that breaks REQ-0245;
# - newer.md and newer-anchor.md: a handoff/v2, refused with
#   format-newer;
# - *.golden: the SessionStart print (08 8.2) and the gap line (08 8.3)
#   of the cases of print_test.go and resume_test.go;
# - fuzz/FuzzDecode/*: the committed seeds of the fuzz target of the
#   decoder: each fixture above, and deep flow nesting, a key of 500 KiB
#   and a file with no closing line.

version = 1

[[annotations]]
path = ["*.md", "*.golden", "fuzz/**"]
SPDX-FileCopyrightText = "2026 Bruno Venceslau"
SPDX-License-Identifier = "GPL-3.0-only"
