#
# The example of 03 3.2, with a real digest and the config repo's URL.
schema: project/v1
name: shop
repos:
  - url: https://github.com/example/shop-api
    primary: true
    dir: shop-api
    ref: main
  - url: https://github.com/example/shop-web
workload: docker.io/docker/sbx-kit-claude@sha256:c0132e89a89d94ddca3984513afdb36be57bd087fcc75823a4d14064b6a39ea5
agent: sbx-kit-claude
kits:
  - product: julieta
  - product: julieta-claude
  - product: os-base
    args: {tz: Etc/UTC}
  - product: git-ssh-sign
    args: {signingKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExample"}
  - personal: my-home
sandboxOptions:
  cpus: 4
  memory: 8g
secrets: [github]
egress:
  extra: [api.stripe.com]
  tools:
    "http:internal-cli": [dl.example.com]
ports: ["8080:8080/tcp"]
salvage:
  excludeIgnored: [node_modules/, .venv/, target/]
run:
  tabs:
    - label: main
      root:
        split: row
        ratio: 0.6
        first: {pane: agent}
        second:
          split: column
          ratio: 0.5
          first: {pane: shell}
          second: {pane: web}
  panes:
    - id: agent
      repo: shop-api
      steps: [[claude]]
      focus: true
    - id: shell
      repo: shop-api
    - id: web
      repo: shop-web
      cwd: app
      env: {PORT: "3000"}
      steps: [[npm, ci], [npm, run, dev]]
