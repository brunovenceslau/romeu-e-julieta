# valid-host-settings.yaml with an argv with no argv[0] (REQ-0205).
schema: host-settings/v1
root: /srv/dev
config:
  project: my-config
  url: https://github.com/example/my-config
  ref: main
tools:
  sbx: /opt/homebrew/bin/sbx
  git: /usr/bin/git
  gitCredentialHelper: osxkeychain
gitHosts:
  - host: github.com
workloadRepositories:
  - docker.io/docker/sbx-kit-claude
signing:
  agentSocket: /srv/romeu/signing-agent.sock
secrets:
  github@my-config:
    service: github
    argv: [/usr/bin/security, find-generic-password, -s, romeu/my-config/github, -w]
  github@shop:
    service: github
    argv: [/usr/bin/security, find-generic-password, -s, romeu/shop/github, -w]
  npm@shop:
    service: npm
    argv: []
