# The license of each fixture of internal/manifest, none of which can
# carry an SPDX header of its own (REUSE 3.3). Every file is canonical
# JSON written for these tests:
# - valid.json: the example of 03 3.6 with its placeholders filled;
# - size-32k.json: the fixture of I30, valid.json with a longer egress
#   list, whose env value is exactly 32 KiB;
# - valid-unknown-member.json: valid.json with one member the format
#   does not name, as a newer romeu would write it;
# - invalid-duplicate-member.json: valid.json with the member agent
#   written twice.

