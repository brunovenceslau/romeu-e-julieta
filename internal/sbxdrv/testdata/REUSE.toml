# The license of the fixtures of the parsers of internal/sbxdrv, none of
# which can carry an SPDX header of its own (REUSE 3.3). Each is the
# output of sbx ls --json as the shape of v0.48.0 is documented, or
# a variation of it written by hand:
# - ls/ok-*.json: documents the parser reads;
# - ls/bad-*.json: documents it refuses with upstream-shape (RJ-310): a
#   shape of sbx before v0.48.0, a renamed list, a member that is read
#   missing, null, empty or mistyped, a document cut short, a duplicate
#   member name, trailing text, a table, an empty output.

version = 1

[[annotations]]
path = ["ls/*.json"]
SPDX-FileCopyrightText = "2026 Bruno Venceslau"
SPDX-License-Identifier = "GPL-3.0-only"
