# The license of each fixture of julieta status, none of which can carry
# an SPDX header of its own (REUSE 3.3). Each is a --json document of
# julieta status written for these tests:
# - valid.json: one repo with an untracked file, after a failed fetch;
# - invalid-duplicate-member.json: valid.json with the member project
#   written twice;
# - invalid-unknown-member.json: valid.json with one member the format
#   does not name.

version = 1

[[annotations]]
path = ["*.json"]
SPDX-FileCopyrightText = "2026 Bruno Venceslau"
SPDX-License-Identifier = "GPL-3.0-only"
