# The license of each fixture of julieta setup, none of which can carry
# an SPDX header of its own (REUSE 3.3). Each is a --json document of
# julieta setup written for these tests:
# - valid.json: a run that fast-forwarded one default branch;
# - invalid-duplicate-member.json: valid.json with the member version
#   written twice;
# - invalid-unknown-member.json: valid.json with one member the format
#   does not name.

version = 1

[[annotations]]
path = ["*.json"]
SPDX-FileCopyrightText = "2026 Bruno Venceslau"
SPDX-License-Identifier = "GPL-3.0-only"
