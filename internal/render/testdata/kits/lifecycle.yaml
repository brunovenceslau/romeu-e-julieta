schemaVersion: "3"
kind: mixin
displayName: lifecycle-fixture
description: conformance fixture for lifecycle capability
capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: echo install
          user: "0"
          env:
            - WORKSPACE_DIR
      startup:
        - command:
            - serve
          background: true
      files:
        - path: /opt/config.txt
          content: hello
          mode: "0600"
          overwrite: false
      interactive:
        - --tty
