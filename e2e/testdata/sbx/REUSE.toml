# The license of the sessions of the fake sbx (10 10.3), none of which can
# carry an SPDX header of its own (REUSE 3.3): one JSON object per line,
# the first line the header of the session. Every session here is written
# by hand from the reference of the sbx version it names, and says so in
# its header with "synthetic": true, until block A records one.

version = 1

[[annotations]]
path = ["**/*.jsonl"]
