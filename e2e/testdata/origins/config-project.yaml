#
# The config repo's own spec for the e2e origins (e2e/internal/romeu,
# Origins.PushConfigRepo): the starter of examples/projects/my-config.yaml
# with the owner and the name the test chooses. {{owner}} and {{name}}
# are replaced before the file is pushed.
schema: project/v1
name: {{name}}
repos:
  - url: https://github.com/{{owner}}/{{name}}
    primary: true
workload: docker.io/docker/sbx-kit-claude@sha256:c0132e89a89d94ddca3984513afdb36be57bd087fcc75823a4d14064b6a39ea5
agent: sbx-kit-claude
kits:
  - product: julieta
  - product: julieta-claude
