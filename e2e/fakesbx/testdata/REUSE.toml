# The license of the sessions the tests of the fake sbx replay, none of
# which can carry an SPDX header of its own (REUSE 3.3). They are test
# data of the fake, written by hand in the format of the sessions under
# e2e/testdata/sbx/ (10 10.3):
# - replay.jsonl: one sandbox created, listed, stopped and removed, with
#   a read recorded twice in one window, a recorded failure and a call
#   that never answers;
# - guard.jsonl: forms the fake refuses with exit 99 (I4, I25) whatever
#   the recording holds, each recorded with exit 0.

version = 1

[[annotations]]
path = ["*.jsonl"]
