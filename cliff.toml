# The git-cliff configuration that writes CHANGELOG.md (12 12.6).

[changelog]
header = """
<!--
SPDX-FileCopyrightText: 2026 Bruno Venceslau
SPDX-License-Identifier: GPL-3.0-only
-->

# Changelog

One section per tag, newest first, generated by git-cliff from the
merged pull requests; nobody writes it by hand. The section of a tag is
the body of its GitHub release and the text `romeu upgrade` prints.

<!-- git-cliff: end of header -->
"""
header_marker = "<!-- git-cliff: end of header -->"
body = """
## {{ version }}

[The documentation at this tag](https://github.com/brunovenceslau/romeu-e-julieta/tree/{{ version }}/docs).
{% if version is matching("^v[0-9]+\\.[0-9]+\\.[0-9]+$") %}\
The sections of the prereleases since the previous stable tag are in [CHANGELOG.md at this tag](https://github.com/brunovenceslau/romeu-e-julieta/blob/{{ version }}/CHANGELOG.md).
{% endif %}
{{ message | default(value="") }}
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group | striptags | trim }}
{% for commit in entry.commits %}
{%- set body = commit.body | default(value="") %}
{%- set sections = "\n" ~ body %}
{%- set_global why = "" %}
{%- for s in sections | split(pat="\n## ") %}{% if why == "" and (s == "Why" or s is starting_with("Why\n")) %}{% set_global why = s | trim_start_matches(pat="Why") | trim %}{% endif %}{% endfor %}
- {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message }}
{%- if why %}

{{ why | indent(prefix="  ", first=true) }}
{%- endif %}
{% endfor %}\
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
commit_preprocessors = [
    # A carriage return is dropped first, so the rules below see LF alone.
    { pattern = '\r', replace = "" },
    # A merge under GitHub's default subject, "Merge pull request #<n> from
    # <owner>/<branch>", holds the pull request's title as the first line of
    # its body: the title becomes the subject, with the number, so the pull
    # requests merged before the title rule of 12 12.4 are entries when their
    # title is in Conventional Commit form (the first 49 of this repository).
    { pattern = '(?s)\AMerge pull request #([0-9]+) from [^\n]+\n\n([^\n]+)', replace = "${2} (#${1})" },
    # An HTML comment of the body is not read (REQ-1146).
    { pattern = '(?s)<!--.*?-->', replace = "" },
    { pattern = '(^|[^\[\w])#([0-9]+)\b', replace = "${1}[#${2}](https://github.com/brunovenceslau/romeu-e-julieta/issues/${2})" },
]
protect_breaking_commits = true
commit_parsers = [
    { field = "merge_commit", pattern = "false", skip = true },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^merge[(:!]", skip = true },
    { message = "^[a-z]+(\\([^)]*\\))?!:", group = "<!-- 00 -->Breaking changes" },
    { body = "(?m)^> - \\[[ xX]\\] Approval: contracts - ", group = "<!-- 00 -->Breaking changes" },
    { message = "^feat", group = "<!-- 01 -->Features" },
    { message = "^fix", group = "<!-- 02 -->Fixes" },
    { message = "^perf", group = "<!-- 03 -->Performance" },
    { message = "^refactor", group = "<!-- 04 -->Refactoring" },
    { message = "^docs", group = "<!-- 05 -->Documentation" },
    { message = "^test", group = "<!-- 06 -->Tests" },
    { message = "^build", group = "<!-- 07 -->Build" },
    { message = "^ci", group = "<!-- 08 -->CI" },
    { message = "^chore", group = "<!-- 09 -->Chores" },
    { message = ".*", group = "<!-- 10 -->Other" },
]
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = []
tag_pattern = "^v[0-9]"
use_branch_tags = true
topo_order = false
topo_order_commits = true
sort_commits = "newest"
recurse_submodules = false
